<ion-content class="shopping-content">
  <div class="shopping-container">

    <!-- CABECERA DE LA APP (idéntica a Inventario) -->
    <header class="dashboard-header">
      <div class="brand-group" (click)="irADashboard()">
        <svg class="refint-logo-svg" viewBox="0 0 24 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="20" height="24" rx="4" stroke="#0053db" stroke-width="2.5"/>
          <line x1="2" y1="12" x2="22" y2="12" stroke="#0053db" stroke-width="2.5"/>
          <line x1="6" y1="5.5" x2="6" y2="9.5" stroke="#0053db" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="6" y1="15.5" x2="6" y2="20.5" stroke="#0053db" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span class="brand-title">Refint</span>
      </div>

      <button class="gear-button" type="button" aria-label="Ajustes" (click)="irAConfiguracion()">
        <ion-icon [icon]="settingsOutline"></ion-icon>
      </button>
    </header>

    <main class="main-shopping-body">

      <!-- TÍTULO -->
      <div class="page-title-block">
        <h1>Lista de Compras</h1>
        <p>Mantén tu cocina siempre abastecida.</p>
      </div>

      <!-- BOTÓN GENERAR AUTOMÁTICAMENTE -->
      <button class="generate-button" type="button" (click)="generarListaAutomatica()">
        <ion-icon [icon]="sparklesOutline"></ion-icon>
        <span>Generar lista automáticamente</span>
      </button>
      <p class="generate-hint">FreshIQ predice lo que falta basado en tu consumo.</p>

      <!-- CATEGORÍAS CON ITEMS -->
      <div class="categories-list">
        <div *ngFor="let cat of categorias" class="category-block">

          <div class="category-header-row">
            <div class="category-title-group">
              <span class="category-icon-circle" [ngClass]="'icon-' + cat.color">
                <ion-icon [icon]="cat.icono"></ion-icon>
              </span>
              <h2>{{ cat.nombre }}</h2>
            </div>
            <span class="items-count-badge">{{ cat.items.length }} {{ cat.items.length === 1 ? 'item' : 'items' }}</span>
          </div>

          <div class="items-list">
            <div *ngFor="let item of cat.items" class="shopping-item-card" (click)="toggleItem(item)">
              <span class="checkbox-box" [class.checked]="item.marcado"></span>
              <span class="item-name" [class.strike]="item.marcado">{{ item.nombre }}</span>
              <span *ngIf="item.badge" class="item-badge" [ngClass]="'badge-' + item.badge.tipo">
                {{ item.badge.texto }}
              </span>
            </div>
          </div>

        </div>
      </div>

      <!-- TARJETAS DE ESTADÍSTICAS -->
      <div class="stats-row">
        <div class="stat-card stat-purple">
          <ion-icon [icon]="trendingDownOutline"></ion-icon>
          <span class="stat-value">20%</span>
          <span class="stat-label">Ahorro proyectado</span>
        </div>
        <div class="stat-card stat-green">
          <ion-icon [icon]="leafOutline"></ion-icon>
          <span class="stat-value">Zero Waste</span>
          <span class="stat-label">Plan optimizado</span>
        </div>
      </div>

    </main>

    <!-- BOTÓN FLOTANTE (+) -->
    <button class="fab-add-button" type="button" (click)="agregarItem()" aria-label="Agregar Producto">
      <ion-icon [icon]="addOutline"></ion-icon>
    </button>

    <!-- MENÚ INFERIOR (SHOPPING RESALTADO EN AZUL) -->
    <nav class="bottom-nav">
      <button
        *ngFor="let nav of bottomNavItems"
        type="button"
        class="nav-item"
        [class.active]="nav.active"
        (click)="navegar(nav)"
      >
        <ng-container *ngIf="nav.id === 'inventory'; else standardIcon">
          <svg class="custom-nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="4" rx="1.5" />
            <path d="M5 7v11a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7" />
            <line x1="10" y1="13" x2="14" y2="13" />
          </svg>
        </ng-container>

        <ng-template #standardIcon>
          <ion-icon [icon]="nav.icon"></ion-icon>
        </ng-template>

        <span>{{ nav.label }}</span>
      </button>
    </nav>

  </div>
</ion-content>

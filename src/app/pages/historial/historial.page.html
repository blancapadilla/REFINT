<app-header title="Historial" [showSearch]="true" [showSettings]="true" (search)="buscar()"></app-header>

<ion-content class="ion-padding">
  <section class="activity-header">
    <h1>Historial de Actividad</h1>
    <p>Seguimiento en tiempo real de tu inventario inteligente.</p>
  </section>

  <ion-list class="timeline-list">
    <div class="date-label">Hoy</div>

    <ion-item
      *ngFor="let item of todayActivities"
      class="timeline-item"
      lines="none"
    >
      <div slot="start" class="timeline-icon" [ngClass]="item.color">
        <ion-icon [name]="item.icon"></ion-icon>
      </div>

      <ion-label>
        <h2 [ngClass]="item.color + '-text'">{{ item.title }}</h2>
        <p>{{ item.description }}</p>
      </ion-label>

      <ion-note slot="end">{{ item.time }}</ion-note>
    </ion-item>

    <div class="date-label">Ayer</div>

    <ion-item
      *ngFor="let item of yesterdayActivities"
      class="timeline-item"
      lines="none"
    >
      <div slot="start" class="timeline-icon" [ngClass]="item.color">
        <ion-icon [name]="item.icon"></ion-icon>
      </div>

      <ion-label>
        <h2 [ngClass]="item.color + '-text'">{{ item.title }}</h2>
        <p>{{ item.description }}</p>
      </ion-label>

      <ion-note slot="end">{{ item.time }}</ion-note>
    </ion-item>
  </ion-list>

  <ion-button class="load-more" expand="block" fill="outline">
    Cargar más actividad
    <ion-icon slot="end" name="chevron-down-outline"></ion-icon>
  </ion-button>

  <nav class="bottom-nav">
    <button
      *ngFor="let nav of bottomNavItems"
      type="button"
      class="nav-item"
      [class.active]="nav.active"
      (click)="navegar(nav)"
    >
      <ng-container *ngIf="nav.id === 'inventory'; else standardIcon">
        <svg class="custom-nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="4" rx="1.5" />
          <path d="M5 7v11a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7" />
          <line x1="10" y1="13" x2="14" y2="13" />
        </svg>
      </ng-container>

      <ng-template #standardIcon>
        <ion-icon [icon]="nav.icon"></ion-icon>
      </ng-template>

      <span>{{ nav.label }}</span>
    </button>
  </nav>
</ion-content>

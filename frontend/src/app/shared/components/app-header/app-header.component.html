<header class="app-header">
  <div class="app-header__brand" role="banner" (click)="goHome()">
    <button
      *ngIf="showBack"
      type="button"
      class="app-header__icon-button app-header__back-button"
      aria-label="Volver"
      (click)="goBack(); $event.stopPropagation()"
    >
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>

    <div class="app-header__icon-wrapper" aria-hidden="true">
      <svg class="app-header__fridge-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="5" y="3" width="14" height="18" rx="3" stroke="#0053db" stroke-width="2.2"/>
        <line x1="5" y1="11" x2="19" y2="11" stroke="#0053db" stroke-width="2.2"/>
        <line x1="9" y1="7" x2="9" y2="9" stroke="#0053db" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="9" y1="14" x2="9" y2="16" stroke="#0053db" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </div>
    <h1 class="app-header__title">{{ title }}</h1>
  </div>

  <div class="app-header__actions">
    <button
      *ngIf="showSearch"
      type="button"
      class="app-header__icon-button"
      aria-label="Buscar"
      (click)="triggerSearch()"
    >
      <ion-icon name="search-outline"></ion-icon>
    </button>

    <button
      *ngIf="showSettings"
      type="button"
      class="app-header__icon-button"
      aria-label="Ajustes"
      (click)="navigateSettings()"
    >
      <ion-icon name="settings-outline"></ion-icon>
    </button>
  </div>
</header>

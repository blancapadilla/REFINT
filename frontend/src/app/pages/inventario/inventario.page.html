<ion-content class="inventory-content">
  <div class="inventory-container">

    <!-- CABECERA DE LA APP (EL LOGO REFINT NAVEGA A /dashboard) -->
    <app-header title="Refint" [showSearch]="false" [showSettings]="true" (search)="buscar()"></app-header>

    <main class="main-body">

      <!-- BARRA DE BÚSQUEDA AVANZADA -->
      <div class="search-row">
        <div class="search-bar">
          <ion-icon [icon]="searchOutline"></ion-icon>
          <input 
            type="text" 
            placeholder="Búsqueda avanzada..." 
            [(ngModel)]="textoBusqueda" 
            (input)="aplicarFiltros()" 
          />
        </div>
        <button class="filter-btn" type="button" aria-label="Filtro">
          <ion-icon [icon]="filterOutline"></ion-icon>
        </button>
      </div>

      <!-- PASTILLAS DE CATEGORÍAS -->
      <div class="categories-pills">
        <button
          *ngFor="let cat of categorias"
          type="button"
          class="pill-button"
          [class.active]="categoriaSeleccionada === cat.id"
          (click)="seleccionarCategoria(cat.id)"
        >
          {{ cat.nombre }}
        </button>
      </div>

      <!-- LISTA DE PRODUCTOS DE INVENTARIO -->
      <div class="products-list">
        <div *ngFor="let item of productosFiltrados" class="product-card">
          <div class="product-thumb">
            <img 
              [src]="item.imagen" 
              [alt]="item.nombre" 
              (error)="onImageError($event)" 
            />
          </div>

          <div class="product-info">
            <div class="title-row">
              <h3>{{ item.nombre }}</h3>
              <span class="status-badge" [ngClass]="'badge-' + item.estado">
                {{ item.etiquetaEstado }}
              </span>
            </div>

            <p class="quantity">{{ item.cantidad }}</p>

            <!-- BANDEROLA DE BÚSQUEDA/DETECCIÓN -->
            <div class="detection-pill">
              <ion-icon [icon]="item.fuente === 'ai' ? cameraOutline : createOutline"></ion-icon>
              <span>{{ item.fuente === 'ai' ? 'Detectado automáticamente' : 'Agregado manualmente' }}</span>
            </div>

            <div class="expiry-row">
              <ion-icon [icon]="calendarOutline"></ion-icon>
              <span class="expiry-text" [class.critical-text]="item.estado === 'critical'">
                {{ item.vencimiento }}
              </span>
            </div>
          </div>

          <div class="card-actions">
            <button type="button" class="icon-action-btn" (click)="editarProducto(item)" aria-label="Editar">
              <ion-icon [icon]="createOutline"></ion-icon>
            </button>
            <button type="button" class="icon-action-btn delete" (click)="eliminarProducto(item)" aria-label="Eliminar">
              <ion-icon [icon]="trashOutline"></ion-icon>
            </button>
          </div>
        </div>

        <div *ngIf="productosFiltrados.length === 0" class="empty-state">
          <p>No se encontraron alimentos en el inventario.</p>
        </div>
      </div>

    </main>

    <!-- BOTÓN FLOTANTE (+) PARA AGREGAR PRODUCTO -->
    <button class="fab-add-button" type="button" (click)="agregarProducto()" aria-label="Agregar Producto">
      <ion-icon [icon]="addOutline"></ion-icon>
    </button>

    <!-- MENÚ INFERIOR (INVENTARIO ACTIVO) -->
    <nav class="bottom-nav">
      <button
        *ngFor="let nav of bottomNavItems"
        type="button"
        class="nav-item"
        [class.active]="nav.active"
        (click)="navegar(nav)"
      >
        <span class="nav-icon-wrap" [class.pill-active]="nav.active">
          <ng-container *ngIf="nav.id === 'inventory'; else standardIcon">
            <svg class="custom-nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="4" rx="1.5" />
              <path d="M5 7v11a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7" />
              <line x1="10" y1="13" x2="14" y2="13" />
            </svg>
          </ng-container>

          <ng-template #standardIcon>
            <ion-icon [icon]="nav.icon"></ion-icon>
          </ng-template>
        </span>
        <span>{{ nav.label }}</span>
      </button>
    </nav>

  </div>
</ion-content>

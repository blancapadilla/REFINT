<ion-content class="inventory-content">
  <div class="inventory-container">

    <!-- CABECERA DE LA APP -->
    <header class="dashboard-header">
      <div class="brand-group" (click)="irADashboard()">
        <svg class="refint-logo-svg" viewBox="0 0 24 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="20" height="24" rx="4" stroke="#0053db" stroke-width="2.5"/>
          <line x1="2" y1="12" x2="22" y2="12" stroke="#0053db" stroke-width="2.5"/>
          <line x1="6" y1="5.5" x2="6" y2="9.5" stroke="#0053db" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="6" y1="15.5" x2="6" y2="20.5" stroke="#0053db" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span class="brand-title">Refint</span>
      </div>

      <button class="gear-button" type="button" aria-label="Ajustes" (click)="irAConfiguracion()">
        <ion-icon [icon]="settingsOutline"></ion-icon>
      </button>
    </header>

    <main class="main-inventory-body">

      <!-- FILA DE BÚSQUEDA Y FILTRO -->
      <div class="search-filter-row">
        <div class="search-wrapper">
          <ion-icon [icon]="searchOutline" class="search-icon"></ion-icon>
          <input 
            type="text" 
            placeholder="Buscar en el inventario..." 
            [(ngModel)]="textoBusqueda"
            (input)="aplicarFiltros()"
          />
        </div>
        <button class="filter-btn" type="button" aria-label="Filtrar">
          <ion-icon [icon]="filterOutline"></ion-icon>
        </button>
      </div>

      <!-- PASTILLAS DE CATEGORÍAS (SCROLL HORIZONTAL) -->
      <div class="category-pills">
        <button 
          *ngFor="let cat of categorias" 
          type="button" 
          class="pill-btn"
          [class.active]="categoriaSeleccionada === cat.id"
          (click)="seleccionarCategoria(cat.id)"
        >
          {{ cat.nombre }}
        </button>
      </div>

      <!-- LISTA DE PRODUCTOS -->
      <div class="inventory-list">
        <div *ngFor="let item of productosFiltrados" class="inventory-card">
          
          <div class="card-image-box">
            <img [src]="item.imagen" [alt]="item.nombre" />
          </div>

          <div class="card-info-box">
            <div class="card-header-row">
              <div class="title-group">
                <h3>{{ item.nombre }}</h3>
                <span class="quantity-text">{{ item.cantidad }}</span>
              </div>
              <span class="status-badge status-{{ item.estado }}">
                {{ item.etiquetaEstado }}
              </span>
            </div>

            <div class="expiry-row">
              <ion-icon [icon]="calendarOutline" [class.danger]="item.estado === 'critical'"></ion-icon>
              <span [class.danger]="item.estado === 'critical'">{{ item.vencimiento }}</span>
            </div>
          </div>

          <!-- BOTONES DE ACCIÓN (EDITAR / ELIMINAR) -->
          <div class="card-actions">
            <button class="action-btn" type="button" (click)="editarProducto(item)">
              <ion-icon [icon]="createOutline"></ion-icon>
            </button>
            <button class="action-btn delete" type="button" (click)="eliminarProducto(item)">
              <ion-icon [icon]="trashOutline"></ion-icon>
            </button>
          </div>

        </div>
      </div>

    </main>

    <!-- BOTÓN FLOTANTE (+) PARA AGREGAR PRODUCTO -->
    <button class="fab-add-button" type="button" (click)="agregarProducto()" aria-label="Agregar Producto">
      <ion-icon [icon]="addOutline"></ion-icon>
    </button>

    <!-- MENÚ INFERIOR (INVENTORY RESALTADO CON FONDO AZUL) -->
    <nav class="bottom-nav">
      <button
        *ngFor="let nav of bottomNavItems"
        type="button"
        class="nav-item"
        [class.active]="nav.active"
        (click)="navegar(nav)"
      >
        <span class="nav-icon-wrap" [class.pill-active]="nav.active">
          <ng-container *ngIf="nav.id === 'inventory'; else standardIcon">
            <svg class="custom-nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="4" rx="1.5" />
              <path d="M5 7v11a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7" />
              <line x1="10" y1="13" x2="14" y2="13" />
            </svg>
          </ng-container>

          <ng-template #standardIcon>
            <ion-icon [icon]="nav.icon"></ion-icon>
          </ng-template>
        </span>
        <span>{{ nav.label }}</span>
      </button>
    </nav>

  </div>
</ion-content>

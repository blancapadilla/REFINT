<ion-content class="login-content">
  <div class="login-container">

    <!-- CABECERA DE LOGIN CON LOGO -->
    <div class="login-header">
      <div class="logo-box">
        <svg class="login-logo-svg" viewBox="0 0 24 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="20" height="24" rx="4" stroke="#0053db" stroke-width="2.5"/>
          <line x1="2" y1="12" x2="22" y2="12" stroke="#0053db" stroke-width="2.5"/>
          <line x1="6" y1="5.5" x2="6" y2="9.5" stroke="#0053db" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="6" y1="15.5" x2="6" y2="20.5" stroke="#0053db" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 class="brand-title">Refrigerador Inteligente</h1>
      <h2 class="welcome-title">Bienvenido de nuevo</h2>
      <p class="welcome-subtitle">Gestiona tu refrigerador de forma inteligente</p>
    </div>

    <!-- FORMULARIO DE INICIO DE SESIÓN -->
    <form (ngSubmit)="iniciarSesion()" class="login-form">
      <!-- Campo Email -->
      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-wrapper">
          <ion-icon [icon]="mailOutline" class="input-icon"></ion-icon>
          <input 
            id="email" 
            type="email" 
            [(ngModel)]="email" 
            name="email" 
            placeholder="nombre@ejemplo.com" 
            required 
          />
        </div>
      </div>

      <!-- Campo Contraseña -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <ion-icon [icon]="lockClosedOutline" class="input-icon"></ion-icon>
          <input 
            id="password" 
            [type]="mostrarPassword ? 'text' : 'password'" 
            [(ngModel)]="password" 
            name="password" 
            placeholder="••••••••" 
            required 
          />
          <button type="button" class="toggle-password" (click)="toggleMostrarPassword()">
            <ion-icon [icon]="mostrarPassword ? eyeOffOutline : eyeOutline"></ion-icon>
          </button>
        </div>
      </div>

      <!-- Olvidaste contraseña -->
      <div class="forgot-link">
        <a (click)="recuperarPassword()">¿Olvidaste tu contraseña?</a>
      </div>

      <!-- Botón Principal Iniciar Sesión -->
      <button type="submit" class="primary-btn">
        <span>Iniciar Sesión</span>
        <ion-icon [icon]="arrowForwardOutline"></ion-icon>
      </button>
    </form>

    <!-- SEPARADOR -->
    <div class="divider">
      <span>O continúa con</span>
    </div>

    <!-- BOTONES SOCIALES (GOOGLE Y APPLE CON ICONO Y TEXTO) -->
    <div class="social-buttons-grid">
      <!-- Botón Google -->
      <button type="button" class="social-btn" (click)="loginGoogle()">
        <svg class="social-icon" viewBox="0 0 24 24" width="20" height="20">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Google</span>
      </button>

      <!-- Botón Apple -->
      <button type="button" class="social-btn" (click)="loginApple()">
        <svg class="social-icon" viewBox="0 0 170 170" width="18" height="18" fill="#000000">
          <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-5.29 0-10.36 1.05-15.2 3.17-4.83 2.13-9.1 3.24-12.8 3.35-4.7 0-9.56-2.06-14.57-6.17-3.48-2.83-7.46-7.57-11.95-14.23-6.53-9.68-11.75-20.35-15.66-32.01-3.92-11.66-5.88-22.86-5.88-33.6 0-13.82 3.38-25.2 10.14-34.15 6.76-8.94 15.14-13.52 25.14-13.73 4.35 0 9.25 1.15 14.7 3.45 5.45 2.3 9.3 3.46 11.55 3.46 1.85 0 5.82-1.2 11.91-3.6 6.09-2.4 11.16-3.5 15.21-3.3 11.1.54 20.12 4.8 27.06 12.78-9.8 5.99-14.59 14.15-14.37 24.48.22 10.12 4.25 18.28 12.09 24.48 3.59 2.83 7.62 4.89 12.09 6.19-2.5 7.4-5.88 15.24-10.14 23.52zM119.22 31.84c0-6.86 2.45-13.44 7.35-19.74 4.9-6.3 11.11-10.18 18.63-11.64.22 1.09.33 2.07.33 2.94 0 6.86-2.51 13.55-7.52 20.07-5.01 6.53-11.16 10.38-18.46 11.55-.11-.98-.33-2.04-.33-3.18z"/>
        </svg>
        <span>Apple</span>
      </button>
    </div>

    <!-- PIE DE PÁGINA -->
    <div class="login-footer">
      <p class="register-text">
        ¿No tienes una cuenta? <a (click)="irARegistro()">Registrarse</a>
      </p>
      <p class="copyright-text">
        FreshFocus AI Smart Kitchen Ecosystem © 2026
      </p>
    </div>

  </div>
</ion-content>

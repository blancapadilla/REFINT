<app-header title="Refint" [showSearch]="false" [showSettings]="true" (search)="buscar()"></app-header>

<ion-content class="ion-padding">
  <section class="summary-cards">
    <article class="summary-card critical-summary">
      <ion-icon name="alert-circle-outline"></ion-icon>
      <strong>2 Críticas</strong>
      <span>AGOTADOS</span>
    </article>

    <article class="summary-card upcoming-summary">
      <ion-icon name="time-outline"></ion-icon>
      <strong>4 Próximos</strong>
      <span>POR VENCER</span>
    </article>
  </section>

  <section class="recent-header">
    <h1>Notificaciones<br>Recientes</h1>

    <button type="button" class="mark-all">
      Marcar todo como<br>leído
    </button>
  </section>

  <section class="alerts-list">
    <article
      *ngFor="let alert of alerts"
      class="alert-card"
      [ngClass]="alert.type"
    >
      <div class="alert-top">
        <div class="alert-icon">
          <ion-icon [name]="alert.icon"></ion-icon>
        </div>

        <div class="alert-info">
          <h2>{{ alert.title }}</h2>
          <p>{{ alert.description }}</p>
        </div>

        <span class="alert-time">{{ alert.time }}</span>
      </div>

      <div *ngIf="alert.status" class="expiration-status">
        <div class="expiration-bar">
          <span></span>
        </div>
        <small>{{ alert.status }}</small>
      </div>

      <div *ngIf="alert.action" class="alert-actions">
        <button type="button" class="primary-action">
          {{ alert.action }}
        </button>

        <button
          *ngIf="alert.secondaryAction"
          type="button"
          class="secondary-action"
        >
          {{ alert.secondaryAction }}
        </button>
      </div>
    </article>
  </section>

  <a class="saving-tip" routerLink="/lista-compras">
    <img
      src="assets/images/tip-inventario.jpg"
      alt="Consejo de ahorro para el inventario"
    >

    <div class="saving-tip-overlay">
      <span>TIP DE AHORRO</span>
      <h2>
        Optimiza tu lista de compras según las alertas de caducidad
        para reducir el desperdicio en un 20%.
      </h2>
    </div>
  </a>

  <nav class="bottom-nav">
    <button
      *ngFor="let nav of bottomNavItems"
      type="button"
      class="nav-item"
      [class.active]="nav.active"
      (click)="navegar(nav)"
    >
      <ng-container *ngIf="nav.id === 'inventory'; else standardIcon">
        <svg class="custom-nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="4" rx="1.5" />
          <path d="M5 7v11a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7" />
          <line x1="10" y1="13" x2="14" y2="13" />
        </svg>
      </ng-container>

      <ng-template #standardIcon>
        <ion-icon [icon]="nav.icon"></ion-icon>
      </ng-template>

      <span>{{ nav.label }}</span>
    </button>
  </nav>
</ion-content>

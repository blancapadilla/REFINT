<ion-content class="refri-content">
  <app-header title="Vincular Refrigerador" [showBack]="true" backRoute="/configuracion"></app-header>
  <main class="refri-main">

    <div class="refri-hero">
      <div class="refri-icon-wrap">
        <svg viewBox="0 0 24 28" fill="none" xmlns="http://www.w3.org/2000/svg" class="refri-svg">
          <rect x="2" y="2" width="20" height="24" rx="4" stroke="#0053db" stroke-width="2.5"/>
          <line x1="2" y1="12" x2="22" y2="12" stroke="#0053db" stroke-width="2.5"/>
          <line x1="6" y1="5.5" x2="6" y2="9.5" stroke="#0053db" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="6" y1="15.5" x2="6" y2="20.5" stroke="#0053db" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
      <h1>Vincula tu refrigerador</h1>
      <p>Ingresa el nombre y el código único de tu dispositivo para comenzar a gestionar tu inventario.</p>
    </div>

    <form (ngSubmit)="registrar()" class="refri-form">

      <div class="form-group">
        <label>Nombre del refrigerador</label>
        <div class="input-wrapper">
          <ion-icon [icon]="cubeOutline" class="field-icon"></ion-icon>
          <input
            type="text"
            [(ngModel)]="nombre"
            name="nombre"
            placeholder="Ej. Cocina Principal"
            autocomplete="off"
          />
        </div>
      </div>

      <div class="form-group">
        <label>Código del dispositivo</label>
        <div class="input-wrapper">
          <ion-icon [icon]="qrCodeOutline" class="field-icon"></ion-icon>
          <input
            type="text"
            [(ngModel)]="codigo"
            name="codigo"
            placeholder="Ej. FRIDGE-X1"
            autocomplete="off"
            style="text-transform: uppercase;"
          />
        </div>
        <span class="hint">Encuéntralo en la etiqueta de tu dispositivo ESP32.</span>
      </div>

      <p *ngIf="errorMsg" class="error-msg">{{ errorMsg }}</p>

      <button type="submit" class="save-btn" [disabled]="!valido() || guardando">
        <ion-icon [icon]="checkmarkOutline"></ion-icon>
        <span>{{ guardando ? 'Registrando...' : 'Vincular refrigerador' }}</span>
      </button>

    </form>

  </main>
</ion-content>

<ion-content class="agregar-content">

  <app-header title="Agregar Producto" [showBack]="true" backRoute="/lista-compras"></app-header>

  <main class="agregar-main">

    <!-- ÉXITO -->
    <div *ngIf="mensajeExito" class="success-banner">
      <ion-icon [icon]="checkmarkOutline"></ion-icon>
      <span>Producto guardado correctamente</span>
    </div>

    <!-- FOTO PLACEHOLDER -->
    <div class="photo-placeholder">
      <ion-icon [icon]="imageOutline"></ion-icon>
      <span>Toca para agregar foto</span>
    </div>

    <!-- FORMULARIO -->
    <form (ngSubmit)="guardar()" class="product-form">

      <div class="form-group">
        <label>Nombre del producto <span class="required">*</span></label>
        <div class="input-wrapper">
          <ion-icon [icon]="cubeOutline" class="field-icon"></ion-icon>
          <input
            type="text"
            [(ngModel)]="producto.nombre"
            name="nombre"
            placeholder="Ej. Leche Entera"
            autocomplete="off"
          />
        </div>
      </div>

      <div class="form-group">
        <label>Marca</label>
        <div class="input-wrapper">
          <ion-icon [icon]="pricetagOutline" class="field-icon"></ion-icon>
          <input
            type="text"
            [(ngModel)]="producto.marca"
            name="marca"
            placeholder="Ej. Lala, La Costeña..."
            autocomplete="off"
          />
        </div>
      </div>

      <div class="form-group">
        <label>Categoría <span class="required">*</span></label>
        <div class="input-wrapper select-wrapper">
          <ion-icon [icon]="layersOutline" class="field-icon"></ion-icon>
          <select [(ngModel)]="producto.categoria" name="categoria">
            <option value="" disabled>Seleccionar categoría</option>
            <option *ngFor="let cat of categorias" [value]="cat.id">{{ cat.label }}</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label>Cantidad</label>
          <input
            type="number"
            [(ngModel)]="producto.cantidad"
            name="cantidad"
            min="0.1"
            step="0.1"
            class="input-plain"
          />
        </div>
        <div class="form-group flex-1">
          <label>Unidad</label>
          <select [(ngModel)]="producto.unidad" name="unidad" class="input-plain">
            <option *ngFor="let u of unidades" [value]="u">{{ u }}</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Fecha de vencimiento</label>
        <div class="input-wrapper">
          <ion-icon [icon]="calendarOutline" class="field-icon"></ion-icon>
          <input
            type="date"
            [(ngModel)]="producto.fechaVencimiento"
            name="fechaVencimiento"
          />
        </div>
      </div>

      <div class="form-group">
        <label>Notas</label>
        <textarea
          [(ngModel)]="producto.notas"
          name="notas"
          rows="3"
          placeholder="Información adicional..."
          class="textarea-plain"
        ></textarea>
      </div>

      <button
        type="submit"
        class="save-btn"
        [disabled]="!formularioValido() || guardando"
      >
        <ion-icon [icon]="checkmarkOutline"></ion-icon>
        <span>{{ guardando ? 'Guardando...' : 'Guardar producto' }}</span>
      </button>

    </form>

  </main>

</ion-content>

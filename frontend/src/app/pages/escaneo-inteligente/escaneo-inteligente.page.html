<ion-content class="scan-content">
  <app-header title="Escaneo Inteligente" [showBack]="true" backRoute="/inventario"></app-header>
  <main class="scan-main">
    <section class="scan-panel">
      <div class="scan-summary">
        <h2>Análisis de Refrigerador</h2>
        <p>{{ scanStatus }}</p>
        <p *ngIf="errorMessage" class="scan-error">{{ errorMessage }}</p>
      </div>

      <div class="scan-visual" [class.is-running]="scanStarted">
        <div class="pulse-ring pulse-ring-large"></div>
        <div class="pulse-ring pulse-ring-small"></div>
        <div class="scanner-core"><ion-icon name="snow-outline"></ion-icon><div class="scan-line"></div></div>
      </div>

      <button class="update-button" type="button" [disabled]="scanStarted" (click)="iniciarEscaneo()">
        <ion-icon name="camera-outline"></ion-icon>
        {{ scanStarted ? 'Escaneando…' : 'Escanear ahora' }}
      </button>

      <div class="scan-log" *ngIf="scanLog.length">
        <div *ngFor="let log of scanLog" class="log-row">
          <ion-icon [name]="log.icon"></ion-icon><span>{{ log.text }}</span>
        </div>
      </div>
    </section>

    <section class="scan-results" *ngIf="resultsReady" [class.visible]="resultsReady">
      <div class="detected-heading"><h2>Procesamiento terminado</h2><span class="badge">En vivo</span></div>
      <p>Las detecciones y cambios reales ya están disponibles en Supabase.</p>
      <button class="update-button" type="button" (click)="confirmarCambios()">
        <ion-icon name="checkmark-circle-outline"></ion-icon>Revisar y confirmar cambios
      </button>
    </section>
  </main>
</ion-content>
